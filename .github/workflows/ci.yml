name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Leak scan (patterns + names, all files)
        run: bash scripts/leak-scan.sh --strict
      - name: gitleaks (independent second scanner, pinned)
        run: |
          set -euo pipefail
          # Archive traversal requires this version; verify the pinned release bytes.
          GL_VER=8.30.1
          GL_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GL_ARCHIVE="$RUNNER_TEMP/gitleaks_${GL_VER}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz" -o "$GL_ARCHIVE"
          printf '%s %s\n' "$GL_SHA256" "$GL_ARCHIVE" | sha256sum --check
          tar -xzf "$GL_ARCHIVE" gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1 --ignore-gitleaks-allow --max-archive-depth 2 --config scripts/release-gitleaks.toml --gitleaks-ignore-path scripts/release-gitleaks-ignore.txt
      - name: Commit messages carry no leaks
        shell: bash
        run: |
          set -euo pipefail
          git log --format=%B > /tmp/wi-commit-messages
          set +e
          rg --quiet -i -f scripts/leak-patterns.txt -f scripts/leak-names.txt /tmp/wi-commit-messages
          scan_status=$?
          set -e
          test "$scan_status" = 1

  build:
    needs: leak-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: System deps (scanner and keytar native build)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Scanner and demo boundary regressions
        run: node --test tests/release/leak-scan.test.mjs tests/release/demo-sandbox.test.mjs
      - name: Fictional recall outcome
        run: npm run demo && npm run demo:recall
      - name: Test
        # `npm test` starts vitest in watch mode; use test:run for CI.
        run: npm run test:run

  web-build:
    needs: leak-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root deps (web tsc references ../src)
        run: npm ci
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Build UI
        run: npm run build
        working-directory: web
      - name: Build UI
        run: npm run build
